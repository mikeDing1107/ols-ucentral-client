syntax = "proto3";

package gnoi.led;

option go_package = "github.com/sonic-net/sonic-gnmi/proto/gnoi/led;led";

service LedControl {
  rpc Flash(FlashRequest) returns (FlashResponse);
}

message FlashRequest {
  int32 led_id = 1;
  // Allowed: red, blue, green, yellow
  string color = 2;
  // Allowed: flash, stable
  string mode = 3;
}

message FlashResponse {
  bool success = 1;
  string message = 2;
}
